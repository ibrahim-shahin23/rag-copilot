version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-copilot-app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-120}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - rag-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-copilot-seed
    command: ["python", "scripts/seed.py", "--data-dir", "data", "--corpus-dir", "eval/corpus"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - rag-data:/app/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  rag-data:
    driver: local
